name: Apply Legal Footer

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-legal-footer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add policy links to site footers
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Expected footer markup not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          old_portfolio_footer = '''  <footer><span>Nadi © 2026</span><span class="footer-links"><a href="legal.html#privacy">Privacy</a><a href="legal.html#terms">Terms</a><a href="legal.html#cookies">Cookies</a><a href="legal.html#accessibility">Accessibility</a></span><span>Built frame by frame</span></footer>'''
          new_portfolio_footer = '''  <footer><span>Nadi © 2026</span><span class="footer-links" data-legal-links data-legal-root=""><a href="policies/privacy.html">Privacy Policy</a><a href="policies/terms.html">Terms of Service</a><a href="policies/accessibility.html">Accessibility</a><a href="policies/disclaimer.html">Disclaimer</a></span><span>Built frame by frame</span></footer>
  <script src="assets/legal-links.js" defer></script>'''
          for page in ('index.html', 'nadi-portfolio.html'):
              replace_once(page, old_portfolio_footer, new_portfolio_footer)

          old_join = '''<script src="join.js"></script>'''
          new_join = '''<footer style="margin-top:20px;padding-top:14px;border-top:1px solid #333;font-size:12px;color:#aaa">
<nav class="footer-links" aria-label="Legal" data-legal-links data-legal-root="" style="display:flex;flex-wrap:wrap;gap:12px">
<a href="policies/privacy.html">Privacy Policy</a>
<a href="policies/terms.html">Terms of Service</a>
<a href="policies/accessibility.html">Accessibility</a>
<a href="policies/disclaimer.html">Disclaimer</a>
</nav>
</footer>
<script src="join.js"></script>
<script src="assets/legal-links.js" defer></script>'''
          replace_once('join.html', old_join, new_join)

          old_legal_css = '''    footer { padding: 28px clamp(20px, 5vw, 72px); border-top: 1px solid var(--line); color: var(--muted); font: 400 9px/1.5 var(--mono); letter-spacing: .12em; text-transform: uppercase; }'''
          new_legal_css = '''    footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 28px clamp(20px, 5vw, 72px); border-top: 1px solid var(--line); color: var(--muted); font: 400 9px/1.5 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
    .footer-links { display: flex; flex-wrap: wrap; gap: 14px; }
    .footer-links a { color: inherit; text-decoration: none; transition: color .2s ease; }
    .footer-links a:hover { color: var(--paper); }'''
          replace_once('legal.html', old_legal_css, new_legal_css)

          old_legal_footer = '''  <footer>Nadi © 2026 · Website policies · nadi@nadidoug.com</footer>'''
          new_legal_footer = '''  <footer>
    <span>Nadi © 2026</span>
    <nav class="footer-links" aria-label="Legal" data-legal-links data-legal-root="">
      <a href="policies/privacy.html">Privacy Policy</a>
      <a href="policies/terms.html">Terms of Service</a>
      <a href="policies/accessibility.html">Accessibility</a>
      <a href="policies/disclaimer.html">Disclaimer</a>
    </nav>
    <a href="mailto:nadi@nadidoug.com">nadi@nadidoug.com</a>
  </footer>
  <script src="assets/legal-links.js" defer></script>'''
          replace_once('legal.html', old_legal_footer, new_legal_footer)

          old_resume = '''<div class="footer mono">// EOF — generated for Nadi Douglas</div>

</body>'''
          new_resume = '''<div class="footer mono">// EOF — generated for Nadi Douglas</div>

<nav class="footer mono legal-links" aria-label="Legal" style="padding-bottom:24px">
  <a href="policies/privacy.html" style="color:inherit">Privacy Policy</a> ·
  <a href="policies/terms.html" style="color:inherit">Terms of Service</a> ·
  <a href="policies/accessibility.html" style="color:inherit">Accessibility</a> ·
  <a href="policies/disclaimer.html" style="color:inherit">Disclaimer</a>
</nav>
<style>@media print{.legal-links{display:none!important}}</style>

</body>'''
          replace_once('nadi-douglas-resume.html', old_resume, new_resume)
          PY

      - name: Commit footer links
        run: |
          rm .github/workflows/apply-legal-footer.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html nadi-portfolio.html join.html legal.html nadi-douglas-resume.html .github/workflows/apply-legal-footer.yml
          git diff --cached --quiet || git commit -m "Add legal footer links"
          git push origin HEAD:main

# Run once on main and remove itself
